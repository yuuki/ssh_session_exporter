name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly; the scheduled run also fuzzes for longer.
    - cron: "23 9 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile
          # Build it with the go.mod toolchain: golangci-lint refuses to lint
          # a module that targets a newer Go than the one it was built with.
          install-mode: goinstall
      - name: go.mod is tidy
        run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test-race
      # The runner has sudo, kernel BTF and tracefs: load the embedded eBPF
      # objects through the verifier and attach them. Skips become failures.
      - run: make test-bpf

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=linux go vet ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-fuzz
      # A failing input lands in testdata/fuzz/<FuzzTarget>/; keep it so that
      # it can be committed as a regression seed.
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # actionlint runs through `go run`; zizmor through pipx.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint-actions
        env:
          # Enables zizmor's online audits (e.g. known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-e2e

  test-e2e-rocky:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1.1.0
        id: lima-actions-setup

      - name: Cache ~/.cache/lima
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Verify Lima
        run: limactl --version

      - name: Run Rocky Linux E2E
        env:
          ROCKY_LIMA_INSTANCE_PREFIX: gha-sshsess
          ROCKY_LIMA_METRICS_PORT: "29842"
          ROCKY_LIMA_SSH_PORT: "39222"
        run: make test-e2e-rocky

      - name: Upload Rocky E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rocky-lima-artifacts
          path: .e2e-artifacts/rocky-lima/
          if-no-files-found: ignore
